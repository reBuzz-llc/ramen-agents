name: code copy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  copy-matches-its-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - run: git fetch -q origin fleet:refs/remotes/origin/fleet engine:refs/remotes/origin/engine
      - run: python3 scripts/check_code_copy.py --verify
