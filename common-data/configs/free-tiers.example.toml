# The free limits beyond the model providers, for the dashboard's "Other free tiers" (scripts/free-tiers.py, hourly).
# Copy to free-tiers.toml and keep the services you use. Check each limit on the provider's own pricing page: free
# plans change. Measures: none | json | s3-bucket | neon-api (see the top of scripts/free-tiers.py).

# The portal's database size, from the nightly copy (scripts/db-standby.sh writes db_mb).
[[service]]
name = "Portal database"
what = "database size (the primary)"
limit = 500
unit = "MB"
resets = "not monthly: what is stored"
measure = "json"
file = "db-standby.json"
field = "db_mb"

# Hosting with no usage API on its free plan: shown as not measurable, with where to look.
[[service]]
name = "Vercel Hobby"
what = "fast data transfer"
limit = 100
unit = "GB/month"
resets = "monthly"
measure = "none"
where = "vercel.com/dashboard/usage (a Hobby project is paused past its limits)"

