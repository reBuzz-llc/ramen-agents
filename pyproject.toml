[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ramen-agents"
version = "0.1.0"
description = "A family of small web agents that runs on free model tiers and keyless search, with a hard fence: no accounts, no spending, no personal data."
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "playwright>=1.45",
  "youtube-transcript-api>=1.0",
  "mcp>=2,<3",  # the duckduckgo-mcp search engine talks to its MCP server
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Real desktop control on macOS (desktop.backend = "mac"); tests and the fake backend need none of it.
desktop = [
  "pyobjc-core==12.2.2",
  "pyobjc-framework-Cocoa==12.2.2",
  "pyobjc-framework-Quartz==12.2.2",
  "pyobjc-framework-ApplicationServices==12.2.2",
]

# Text-only browsing through Tor (browser.backend = "tor"): lets httpx use Tor's SOCKS proxy.
tor = ["httpx[socks]>=0.27"]

[project.scripts]
bot = "explorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
explorer = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
