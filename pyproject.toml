[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "explorer"
version = "0.1.0"
description = "A curiosity-driven local agent that roams the web and keeps a journal."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "playwright>=1.45",
  "youtube-transcript-api>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Real desktop control on macOS (desktop.backend = "mac"); tests and the fake backend need none of it.
desktop = [
  "pyobjc-core==12.2.2",
  "pyobjc-framework-Cocoa==12.2.2",
  "pyobjc-framework-Quartz==12.2.2",
  "pyobjc-framework-ApplicationServices==12.2.2",
]

# Text-only browsing through Tor (browser.backend = "tor"): lets httpx use Tor's SOCKS proxy.
tor = ["httpx[socks]>=0.27"]

[project.scripts]
bot = "explorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
explorer = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
