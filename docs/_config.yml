# GitHub Pages (Settings -> Pages -> Deploy from branch: main, /docs). Plain Markdown, built by GitHub; no build step.
title: ramen-agents
description: >-
  A free, open-source team of five AI agents that looks for your next client: it finds businesses with a
  gap you can fix, prices an offer and writes the email. $0 in model fees on the default free tiers; we set it up for you.
url: https://rebuzz-llc.github.io
baseurl: /ramen-agents
lang: en
# No theme: the site's own layouts (_layouts/) and one stylesheet (assets/site.css). Pages stay plain Markdown.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
image: /assets/og.png
defaults:            # every page's og:image and twitter:image (jekyll-seo-tag reads it per page), and the reading layout
  - scope:
      path: ""
    values:
      image: /assets/og.png
      layout: default
logo: /assets/og.png
github_username: reBuzz-llc
social:
  name: ramen-agents
  links:
    - https://github.com/reBuzz-llc/ramen-agents
nav:                   # the header's links; the other pages stay linked from the home page, the FAQ and the footer
  - title: Set it up for me
    url: /set-up-for-you.html
  - title: Try it
    url: /try-without-a-key.html
  - title: The fence
    url: /fence.html
  - title: Free AI APIs
    url: /free-ai-apis.html
  - title: FAQ
    url: /faq.html
repo_url: https://github.com/reBuzz-llc/ramen-agents
run_yourself_url: https://github.com/reBuzz-llc/ramen-agents#try-it-in-10-minutes-no-key
goatcounter_code: ramen
